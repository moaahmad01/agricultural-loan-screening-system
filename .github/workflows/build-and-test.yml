name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: AgriculturalLoanSystem/package-lock.json
      - run: npm ci
        working-directory: AgriculturalLoanSystem
      - run: npm run build:css
        working-directory: AgriculturalLoanSystem
      - run: dotnet restore AgriculturalLoanSystem.sln --locked-mode
      - run: dotnet build AgriculturalLoanSystem.sln --configuration Release --no-restore
      - run: dotnet test AgriculturalLoanSystem.sln --configuration Release --no-build --logger trx
      - run: dotnet tool restore
      - run: dotnet ef migrations has-pending-model-changes --project AgriculturalLoanSystem --configuration Release --no-build
      - run: docker compose config --quiet
        env:
          DB_SA_PASSWORD: ValidationOnly_NotUsed123!
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
